name: Rebygg og deploy

# Chainguard-baseimagene får jevnlig sikkerhetsoppdateringer uten at taggen endres, og
# Chainguard backporter ikke til eldre bygg. Uten rebygg blir en app som ikke har
# endringer i egen kode, liggende med gamle sårbarheter.
# https://sikkerhet.nav.no/docs/verktoy/chainguard-dockerimages
#
# Dev får siste commit på standardbranchen. Prod får koden fra siste publiserte release,
# slik at rebygget aldri slipper ut kode som ikke er releaset.

on:
  workflow_call:
    inputs:
      bygg-kommando:
        description: Kommando som bygger og tester appen
        required: true
        type: string
      byggverktoy:
        description: maven eller gradle (styrer cache i setup-java)
        required: true
        type: string
      java-versjon:
        required: false
        type: string
        default: '21'
      team:
        required: false
        type: string
        default: teammelosys
      platforms:
        description: Plattformer imaget bygges for
        required: false
        type: string
        default: linux/amd64
      runner:
        description: Runner for byggejobbene
        required: false
        type: string
        default: ubuntu-latest
      dev-cluster:
        required: true
        type: string
      dev-vars:
        description: Én til tre vars-filer for dev, én per linje. Deployes i rekkefølge, og stopper ved første feil.
        required: true
        type: string
      prod-cluster:
        required: true
        type: string
      prod-vars:
        required: false
        type: string
        default: nais/vars-prod.json
      nais-resource:
        required: false
        type: string
        default: nais/nais.yml
      prod:
        description: Deploy også til prod (bare hvis dev gikk bra)
        required: false
        type: boolean
        default: false
    secrets:
      READER_TOKEN:
        required: false
      SLACK_WEBHOOK:
        required: false

permissions: {}

jobs:
  finn-commits:
    name: Finn commits for dev og prod
    # Manuell kjøring bruker workflow-filen fra valgt branch.
    # Den skal ikke kunne deployes før endringene er på standardbranchen.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      prod-sha: ${{ steps.finn.outputs.prod-sha }}
      prod-tag: ${{ steps.finn.outputs.prod-tag }}
      dev-vars-1: ${{ steps.vars.outputs.vars-1 }}
      dev-vars-2: ${{ steps.vars.outputs.vars-2 }}
      dev-vars-3: ${{ steps.vars.outputs.vars-3 }}
    steps:
      - name: Siste commit og siste publiserte release
        id: finn
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        # Siste publiserte release, også prerelease: deploy-prod i appene deployer alle
        # publiserte releaser, mens releases/latest hopper over prereleaser.
        run: |
          prod_tag=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '[.[] | select(.draft | not)] | max_by(.published_at) | .tag_name // ""')
          prod_sha=''
          if [[ -n "$prod_tag" ]]; then
            prod_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$prod_tag" --jq .sha)
          else
            echo "::warning::Fant ingen publisert release; prod rebygges ikke"
          fi
          echo "prod-sha=$prod_sha" >> "$GITHUB_OUTPUT"
          echo "prod-tag=$prod_tag" >> "$GITHUB_OUTPUT"
          {
            echo "Dev: $DEFAULT_BRANCH ($GITHUB_SHA)"
            echo "Prod: ${prod_tag:-ingen release} ($prod_sha)"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Fordel dev-vars
        id: vars
        env:
          VARS: ${{ inputs.dev-vars }}
        run: |
          read -r -d '' -a filer <<< "$VARS" || true
          if (( ${#filer[@]} < 1 || ${#filer[@]} > 3 )); then
            echo "::error::dev-vars må ha én til tre filer, fikk ${#filer[@]}"
            exit 1
          fi
          for i in "${!filer[@]}"; do
            echo "vars-$((i + 1))=${filer[$i]}" >> "$GITHUB_OUTPUT"
          done

  bygg-dev:
    name: Bygg standardbranch
    needs: finn-commits
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
      id-token: write
    outputs:
      image: ${{ steps.docker-push.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: ${{ inputs.java-versjon }}
          distribution: temurin
          cache: ${{ inputs.byggverktoy }}
      - name: Bygg og test
        env:
          BYGG_KOMMANDO: ${{ inputs.bygg-kommando }}
          GITHUB_TOKEN: ${{ github.token }}
          READER_TOKEN: ${{ secrets.READER_TOKEN }}
          PASSWORD: ${{ secrets.READER_TOKEN }}
        run: bash -c "$BYGG_KOMMANDO"
      # Ingen egen tag: imaget får en unik datotag, og deployen bruker digest. Sha-taggen
      # skal fortsatt peke på imaget som ble testet da commiten ble merget.
      - name: Bygg og publiser image
        id: docker-push
        uses: nais/docker-build-push@588f76a6f45aeb1e75d5e8417ec6ef6d79b2b39f # v0
        with:
          team: ${{ inputs.team }}
          platforms: ${{ inputs.platforms }}

  deploy-dev:
    name: Deploy til dev
    needs: [ finn-commits, bygg-dev ]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    outputs:
      deployet: ${{ steps.gjeldende.outputs.deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      # En vanlig deploy kan ha kommet med nyere kode mens vi bygget. Den har allerede
      # ferskt baseimage, og vi skal ikke rulle tilbake til eldre kode.
      - name: Er commiten fortsatt siste på standardbranchen?
        id: gjeldende
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          naa=$(gh api "repos/$GITHUB_REPOSITORY/commits/$DEFAULT_BRANCH" --jq .sha)
          if [[ "$naa" == "$SHA" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "$DEFAULT_BRANCH er nå $naa, ikke $SHA; hopper over dev-deploy" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Deploy ${{ needs.finn-commits.outputs.dev-vars-1 }}
        if: steps.gjeldende.outputs.deploy == 'true'
        uses: nais/deploy/actions/deploy@30ed20fc7021e78d03ca9544b0c561d37f826296 # v3
        env:
          CLUSTER: ${{ inputs.dev-cluster }}
          RESOURCE: ${{ inputs.nais-resource }}
          VARS: ${{ needs.finn-commits.outputs.dev-vars-1 }}
          IMAGE: ${{ needs.bygg-dev.outputs.image }}
      - name: Deploy ${{ needs.finn-commits.outputs.dev-vars-2 }}
        if: steps.gjeldende.outputs.deploy == 'true' && needs.finn-commits.outputs.dev-vars-2 != ''
        uses: nais/deploy/actions/deploy@30ed20fc7021e78d03ca9544b0c561d37f826296 # v3
        env:
          CLUSTER: ${{ inputs.dev-cluster }}
          RESOURCE: ${{ inputs.nais-resource }}
          VARS: ${{ needs.finn-commits.outputs.dev-vars-2 }}
          IMAGE: ${{ needs.bygg-dev.outputs.image }}
      - name: Deploy ${{ needs.finn-commits.outputs.dev-vars-3 }}
        if: steps.gjeldende.outputs.deploy == 'true' && needs.finn-commits.outputs.dev-vars-3 != ''
        uses: nais/deploy/actions/deploy@30ed20fc7021e78d03ca9544b0c561d37f826296 # v3
        env:
          CLUSTER: ${{ inputs.dev-cluster }}
          RESOURCE: ${{ inputs.nais-resource }}
          VARS: ${{ needs.finn-commits.outputs.dev-vars-3 }}
          IMAGE: ${{ needs.bygg-dev.outputs.image }}

  bygg-prod:
    name: Bygg release
    needs: finn-commits
    # Er releasen samme commit som standardbranchen, gjenbrukes dev-imaget.
    if: >-
      inputs.prod
      && needs.finn-commits.outputs.prod-sha != ''
      && needs.finn-commits.outputs.prod-sha != github.sha
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
      id-token: write
    outputs:
      image: ${{ steps.docker-push.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.finn-commits.outputs.prod-sha }}
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: ${{ inputs.java-versjon }}
          distribution: temurin
          cache: ${{ inputs.byggverktoy }}
      - name: Bygg og test
        env:
          BYGG_KOMMANDO: ${{ inputs.bygg-kommando }}
          GITHUB_TOKEN: ${{ github.token }}
          READER_TOKEN: ${{ secrets.READER_TOKEN }}
          PASSWORD: ${{ secrets.READER_TOKEN }}
        run: bash -c "$BYGG_KOMMANDO"
      - name: Bygg og publiser image
        id: docker-push
        uses: nais/docker-build-push@588f76a6f45aeb1e75d5e8417ec6ef6d79b2b39f # v0
        with:
          team: ${{ inputs.team }}
          platforms: ${{ inputs.platforms }}

  deploy-prod:
    name: Deploy til prod
    needs: [ finn-commits, bygg-dev, deploy-dev, bygg-prod ]
    if: >-
      !cancelled()
      && inputs.prod
      && needs.finn-commits.outputs.prod-sha != ''
      && needs.deploy-dev.result == 'success'
      && needs.deploy-dev.outputs.deployet == 'true'
      && (needs.bygg-prod.result == 'success' || needs.bygg-prod.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    outputs:
      deployet: ${{ steps.gjeldende.outputs.deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.finn-commits.outputs.prod-sha }}
          persist-credentials: false
      # En release kan ha blitt publisert og deployet mens vi bygget. Samme oppslag som i
      # finn-commits, så prereleaser også telles.
      - name: Er commiten fortsatt siste release?
        id: gjeldende
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.finn-commits.outputs.prod-sha }}
        run: |
          tag=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '[.[] | select(.draft | not)] | max_by(.published_at) | .tag_name // ""')
          naa=$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)
          if [[ "$naa" == "$SHA" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Siste release er $tag ($naa), ikke $SHA; hopper over prod-deploy" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Deploy ${{ inputs.prod-vars }}
        if: steps.gjeldende.outputs.deploy == 'true'
        uses: nais/deploy/actions/deploy@30ed20fc7021e78d03ca9544b0c561d37f826296 # v3
        env:
          CLUSTER: ${{ inputs.prod-cluster }}
          RESOURCE: ${{ inputs.nais-resource }}
          VARS: ${{ inputs.prod-vars }}
          IMAGE: ${{ needs.bygg-prod.outputs.image || needs.bygg-dev.outputs.image }}
          TIMEOUT: 20m

  # Egen jobb, så feil i alle de andre jobbene også varsles.
  varsle:
    name: Slack-varsel
    needs: [ finn-commits, bygg-dev, deploy-dev, bygg-prod, deploy-prod ]
    if: always() && needs.finn-commits.result != 'skipped'
    runs-on: ubuntu-latest
    permissions: {}
    env:
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
    steps:
      - name: Slack-varsel
        if: env.SLACK_WEBHOOK != ''
        uses: rtCamp/action-slack-notify@06cc13f74fa8d4d2296c09455d91e9453e4025f4 # v2.4.1
        env:
          SLACK_COLOR: ${{ contains(needs.*.result, 'failure') && 'danger' || 'good' }}
          SLACK_USERNAME: Github Actions
          SLACK_ICON: https://github.com/github.png?size=48
          SLACK_TITLE: Rebygg av ${{ github.event.repository.name }} ${{ contains(needs.*.result, 'failure') && 'feilet' || 'er ferdig' }}
          SLACK_MESSAGE: >-
            dev: ${{ needs.deploy-dev.outputs.deployet == 'false' && 'hoppet over (nyere deploy)' || needs.deploy-dev.result }}
            · prod (${{ needs.finn-commits.outputs.prod-tag || 'ingen release' }}):
            ${{ needs.deploy-prod.outputs.deployet == 'false' && 'hoppet over (nyere deploy)' || needs.deploy-prod.result }}
            · ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
