name: Rebygg og deploy

# Chainguard-baseimagene får jevnlig sikkerhetsoppdateringer uten at taggen endres, og
# Chainguard backporter ikke til eldre bygg. Uten rebygg blir en app som ikke har
# endringer i egen kode, liggende med gamle sårbarheter.
# https://sikkerhet.nav.no/docs/verktoy/chainguard-dockerimages
#
# Dev får siste commit på standardbranchen. Prod får koden fra siste publiserte release,
# slik at rebygget aldri slipper ut kode som ikke er releaset. Unntaket er apper som selv
# deployer standardbranchen til prod uten release (prod-fra-standardbranch). Dev og prod bygges og
# deployes uavhengig av hverandre: de bygger ulik kode, ingen tester kjører etter
# dev-deployen, og Nais venter på readiness i prod. Feil i dev skal ikke holde prod
# igjen med gammelt baseimage.

on:
  workflow_call:
    inputs:
      bygg-kommando:
        description: Kommando som bygger og tester appen
        required: true
        type: string
      byggverktoy:
        description: maven eller gradle (styrer cache i setup-java)
        required: true
        type: string
      java-versjon:
        required: false
        type: string
        default: '21'
      node-versjon:
        description: Setter opp Node før bygget, f.eks. lts/* eller 24. Tom betyr ingen Node.
        required: false
        type: string
        default: ''
      pnpm-versjon:
        description: Setter opp pnpm før bygget, f.eks. 10. Tom betyr ingen pnpm.
        required: false
        type: string
        default: ''
      team:
        required: false
        type: string
        default: teammelosys
      platforms:
        description: Plattformer imaget bygges for
        required: false
        type: string
        default: linux/amd64
      runner:
        description: Runner for byggejobbene
        required: false
        type: string
        default: ubuntu-latest
      dev-cluster:
        required: true
        type: string
      dev-vars:
        description: Én til tre vars-filer for dev, én per linje. Deployes i rekkefølge, og stopper ved første feil. Påkrevd uten uten-vars.
        required: false
        type: string
        default: ''
      prod-cluster:
        required: true
        type: string
      prod-vars:
        required: false
        type: string
        default: nais/vars-prod.json
      uten-vars:
        description: Appen har ingen vars-filer. Dev og prod deployes da én gang hver uten vars, og dev-vars og prod-vars brukes ikke.
        required: false
        type: boolean
        default: false
      dev-var:
        description: Template-variabler for dev som key=value, kommaseparert (VAR i nais/deploy). Kommer i tillegg til vars-filene.
        required: false
        type: string
        default: ''
      prod-var:
        description: Template-variabler for prod som key=value, kommaseparert (VAR i nais/deploy). Kommer i tillegg til vars-filen.
        required: false
        type: string
        default: ''
      nais-resource:
        required: false
        type: string
        default: nais/nais.yml
      dev-resource:
        description: Nais-ressurs for dev, når den er en annen enn i prod. Overstyrer nais-resource.
        required: false
        type: string
        default: ''
      prod-resource:
        description: Nais-ressurs for prod, når den er en annen enn i dev. Overstyrer nais-resource.
        required: false
        type: string
        default: ''
      prod:
        description: Deploy også til prod
        required: false
        type: boolean
        default: false
      uten-prerelease:
        description: Prod får siste release som ikke er merket pre-release, for apper der deploy-prod hopper over prereleaser.
        required: false
        type: boolean
        default: false
      prod-fra-standardbranch:
        description: For apper uten releaser, som deployer standardbranchen til både dev og prod. Prod får da samme image som dev, etter at dev-deployen gikk bra.
        required: false
        type: boolean
        default: false
      dev-deploy-workflow:
        description: Appens vanlige deploy-workflow til dev, f.eks. deploy-dev.yaml. Brukes til å finne commiten som blir erstattet.
        required: false
        type: string
        default: ''
      prod-deploy-workflow:
        description: Appens vanlige deploy-workflow til prod, f.eks. deploy-prod.yaml. Brukes til å finne commiten som blir erstattet.
        required: false
        type: string
        default: ''
    secrets:
      READER_TOKEN:
        required: false
      SLACK_WEBHOOK:
        required: false

permissions: {}

jobs:
  finn-commits:
    name: Finn commits for dev og prod
    # Manuell kjøring bruker workflow-filen fra valgt branch.
    # Den skal ikke kunne deployes før endringene er på standardbranchen.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      prod-sha: ${{ steps.finn.outputs.prod-sha }}
      prod-tag: ${{ steps.finn.outputs.prod-tag }}
      dev-vars-1: ${{ steps.vars.outputs.vars-1 }}
      dev-vars-2: ${{ steps.vars.outputs.vars-2 }}
      dev-vars-3: ${{ steps.vars.outputs.vars-3 }}
    steps:
      - name: Siste commit og siste publiserte release
        id: finn
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          UTEN_PRERELEASE: ${{ inputs.uten-prerelease }}
          FRA_STANDARDBRANCH: ${{ inputs.prod-fra-standardbranch }}
        # Velger samme release som ligger i prod. deploy-prod deployer vanligvis også releaser
        # merket «pre-release», men GitHubs «Latest» hopper over dem. Drafts er ikke i prod.
        run: |
          if [[ "$FRA_STANDARDBRANCH" == 'true' ]]; then
            echo "prod-sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            echo "prod-tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          utvalg='select(.draft | not)'
          [[ "$UTEN_PRERELEASE" == 'true' ]] && utvalg+=' | select(.prerelease | not)'
          prod_tag=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq "[.[] | $utvalg] | max_by(.published_at) | .tag_name // \"\"")
          prod_sha=''
          if [[ -n "$prod_tag" ]]; then
            prod_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$prod_tag" --jq .sha)
          else
            echo "::warning::Fant ingen publisert release; prod rebygges ikke"
          fi
          echo "prod-sha=$prod_sha" >> "$GITHUB_OUTPUT"
          echo "prod-tag=$prod_tag" >> "$GITHUB_OUTPUT"

      # Workflowen ser ikke hva som kjører i clusteret, så commiten som erstattes er den
      # fra siste vellykkede deploy-kjøring. Manuelle deployer kommer ikke med.
      - name: Forrige deployede commit
        id: forrige
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DEV_WORKFLOW: ${{ inputs.dev-deploy-workflow }}
          PROD_WORKFLOW: ${{ inputs.prod-deploy-workflow }}
          FRA_STANDARDBRANCH: ${{ inputs.prod-fra-standardbranch }}
        run: |
          siste_vellykkede() {
            [[ -n "$1" ]] || return 0
            # gh skriver feilsvaret til stdout, så det må ikke slippe gjennom.
            if ! svar=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$1/runs?status=success&per_page=1$2" \
              --jq '.workflow_runs[0] | select(.) | "\(.created_at) \(.head_sha) \(.head_branch)"'); then
              echo "::warning::Fant ikke kjøringer av $1" >&2
              return 0
            fi
            echo "$svar"
          }
          # GITHUB_WORKFLOW_REF er appens workflow, f.eks. owner/repo/.github/workflows/rebygg-og-deploy.yml@refs/heads/main
          rebygg=${GITHUB_WORKFLOW_REF%@*}
          rebygg=${rebygg##*/}

          read -r _ dev_sha _ < <({
            siste_vellykkede "$DEV_WORKFLOW" "&branch=$DEFAULT_BRANCH"
            siste_vellykkede "$rebygg" "&branch=$DEFAULT_BRANCH"
          } | sort -r | head -1) || true
          # Tidligere rebygg tas ikke med for prod: de deployer siste release, som
          # deploy-workflowen allerede har deployet.
          if [[ "$FRA_STANDARDBRANCH" == 'true' ]]; then
            read -r _ prod_sha _ < <(siste_vellykkede "$PROD_WORKFLOW" "&branch=$DEFAULT_BRANCH") || true
            prod_tag=''
          else
            read -r _ prod_sha prod_tag < <(siste_vellykkede "$PROD_WORKFLOW" "") || true
          fi

          {
            echo "dev-sha=$dev_sha"
            echo "prod-sha=$prod_sha"
            echo "prod-tag=$prod_tag"
          } >> "$GITHUB_OUTPUT"

      - name: Oppsummering
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DEV_FORRIGE: ${{ steps.forrige.outputs.dev-sha }}
          PROD_VALGT: ${{ inputs.prod }}
          PROD_FORRIGE: ${{ steps.forrige.outputs.prod-sha }}
          PROD_FORRIGE_TAG: ${{ steps.forrige.outputs.prod-tag }}
          PROD_SHA: ${{ steps.finn.outputs.prod-sha }}
          PROD_TAG: ${{ steps.finn.outputs.prod-tag }}
          FRA_STANDARDBRANCH: ${{ inputs.prod-fra-standardbranch }}
        run: |
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          commit() { echo "[\`${1:0:7}\`]($url/commit/$1)"; }
          release() { echo "[$1]($url/releases/tag/$1) ($(commit "$2"))"; }
          # Rebygget bygger normalt samme commit som allerede kjører, med nytt baseimage.
          endring() {  # forrige-sha ny-sha forrige-tekst ny-tekst
            if [[ -z "$1" ]]; then echo "ukjent → $4"
            elif [[ "$1" == "$2" ]]; then echo "$4 (samme commit, nytt baseimage)"
            else echo "$3 → $4"
            fi
          }

          dev=$(endring "$DEV_FORRIGE" "$GITHUB_SHA" "$(commit "$DEV_FORRIGE")" "$(commit "$GITHUB_SHA")")
          if [[ "$PROD_VALGT" != 'true' ]]; then
            prod='ikke valgt'
          elif [[ -z "$PROD_SHA" ]]; then
            prod='ingen publisert release'
          elif [[ "$FRA_STANDARDBRANCH" == 'true' ]]; then
            prod="$(endring "$PROD_FORRIGE" "$PROD_SHA" "$(commit "$PROD_FORRIGE")" "$(commit "$PROD_SHA")")"
          else
            prod=$(endring "$PROD_FORRIGE" "$PROD_SHA" "$(release "$PROD_FORRIGE_TAG" "$PROD_FORRIGE")" "$(release "$PROD_TAG" "$PROD_SHA")")
          fi
          {
            echo "- **Dev** ([$DEFAULT_BRANCH]($url/tree/$DEFAULT_BRANCH)): $dev"
            echo "- **Prod**: $prod"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fordel dev-vars
        id: vars
        env:
          VARS: ${{ inputs.dev-vars }}
          UTEN_VARS: ${{ inputs.uten-vars }}
        run: |
          read -r -d '' -a filer <<< "$VARS" || true
          if [[ "$UTEN_VARS" == 'true' ]]; then
            if (( ${#filer[@]} > 0 )); then
              echo "::error::dev-vars kan ikke brukes sammen med uten-vars"
              exit 1
            fi
            exit 0
          fi
          if (( ${#filer[@]} < 1 || ${#filer[@]} > 3 )); then
            echo "::error::dev-vars må ha én til tre filer, fikk ${#filer[@]}"
            exit 1
          fi
          for i in "${!filer[@]}"; do
            echo "vars-$((i + 1))=${filer[$i]}" >> "$GITHUB_OUTPUT"
          done

  bygg-dev:
    name: Bygg standardbranch
    needs: finn-commits
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
      id-token: write
    outputs:
      image: ${{ steps.docker-push.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: ${{ inputs.java-versjon }}
          distribution: temurin
          cache: ${{ inputs.byggverktoy }}
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        if: inputs.pnpm-versjon != ''
        with:
          version: ${{ inputs.pnpm-versjon }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: inputs.node-versjon != ''
        with:
          node-version: ${{ inputs.node-versjon }}
          # Skriver .npmrc som gir NODE_AUTH_TOKEN til @navikt-pakkene.
          registry-url: https://npm.pkg.github.com
      - name: Bygg og test
        env:
          BYGG_KOMMANDO: ${{ inputs.bygg-kommando }}
          GITHUB_TOKEN: ${{ github.token }}
          READER_TOKEN: ${{ secrets.READER_TOKEN }}
          PASSWORD: ${{ secrets.READER_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.READER_TOKEN }}
        run: bash -c "$BYGG_KOMMANDO"
      # Ingen egen tag: imaget får en unik datotag, og deployen bruker digest. Sha-taggen
      # skal fortsatt peke på imaget som ble testet da commiten ble merget.
      - name: Bygg og publiser image
        id: docker-push
        uses: nais/docker-build-push@588f76a6f45aeb1e75d5e8417ec6ef6d79b2b39f # v0
        with:
          team: ${{ inputs.team }}
          platforms: ${{ inputs.platforms }}

  deploy-dev:
    name: Deploy til dev
    needs: [ finn-commits, bygg-dev ]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    outputs:
      deployet: ${{ steps.gjeldende.outputs.deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      # En vanlig deploy kan ha kommet med nyere kode mens vi bygget. Den har allerede
      # ferskt baseimage, og vi skal ikke rulle tilbake til eldre kode.
      - name: Er commiten fortsatt siste på standardbranchen?
        id: gjeldende
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          naa=$(gh api "repos/$GITHUB_REPOSITORY/commits/$DEFAULT_BRANCH" --jq .sha)
          if [[ "$naa" == "$SHA" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "$DEFAULT_BRANCH er nå $naa, ikke $SHA; hopper over dev-deploy" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Deploy ${{ needs.finn-commits.outputs.dev-vars-1 || inputs.dev-cluster }}
        if: steps.gjeldende.outputs.deploy == 'true'
        uses: nais/deploy/actions/deploy@427e29c94d911626a023a76f402f6dcae1f840b7 # v3
        env:
          CLUSTER: ${{ inputs.dev-cluster }}
          RESOURCE: ${{ inputs.dev-resource || inputs.nais-resource }}
          VARS: ${{ needs.finn-commits.outputs.dev-vars-1 }}
          VAR: ${{ inputs.dev-var }}
          IMAGE: ${{ needs.bygg-dev.outputs.image }}
      - name: Deploy ${{ needs.finn-commits.outputs.dev-vars-2 }}
        if: steps.gjeldende.outputs.deploy == 'true' && needs.finn-commits.outputs.dev-vars-2 != ''
        uses: nais/deploy/actions/deploy@427e29c94d911626a023a76f402f6dcae1f840b7 # v3
        env:
          CLUSTER: ${{ inputs.dev-cluster }}
          RESOURCE: ${{ inputs.dev-resource || inputs.nais-resource }}
          VARS: ${{ needs.finn-commits.outputs.dev-vars-2 }}
          VAR: ${{ inputs.dev-var }}
          IMAGE: ${{ needs.bygg-dev.outputs.image }}
      - name: Deploy ${{ needs.finn-commits.outputs.dev-vars-3 }}
        if: steps.gjeldende.outputs.deploy == 'true' && needs.finn-commits.outputs.dev-vars-3 != ''
        uses: nais/deploy/actions/deploy@427e29c94d911626a023a76f402f6dcae1f840b7 # v3
        env:
          CLUSTER: ${{ inputs.dev-cluster }}
          RESOURCE: ${{ inputs.dev-resource || inputs.nais-resource }}
          VARS: ${{ needs.finn-commits.outputs.dev-vars-3 }}
          VAR: ${{ inputs.dev-var }}
          IMAGE: ${{ needs.bygg-dev.outputs.image }}

  bygg-prod:
    name: Bygg release
    needs: finn-commits
    if: inputs.prod && !inputs.prod-fra-standardbranch && needs.finn-commits.outputs.prod-sha != ''
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
      id-token: write
    outputs:
      image: ${{ steps.docker-push.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.finn-commits.outputs.prod-sha }}
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: ${{ inputs.java-versjon }}
          distribution: temurin
          cache: ${{ inputs.byggverktoy }}
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        if: inputs.pnpm-versjon != ''
        with:
          version: ${{ inputs.pnpm-versjon }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: inputs.node-versjon != ''
        with:
          node-version: ${{ inputs.node-versjon }}
          # Skriver .npmrc som gir NODE_AUTH_TOKEN til @navikt-pakkene.
          registry-url: https://npm.pkg.github.com
      - name: Bygg og test
        env:
          BYGG_KOMMANDO: ${{ inputs.bygg-kommando }}
          GITHUB_TOKEN: ${{ github.token }}
          READER_TOKEN: ${{ secrets.READER_TOKEN }}
          PASSWORD: ${{ secrets.READER_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.READER_TOKEN }}
        run: bash -c "$BYGG_KOMMANDO"
      - name: Bygg og publiser image
        id: docker-push
        uses: nais/docker-build-push@588f76a6f45aeb1e75d5e8417ec6ef6d79b2b39f # v0
        with:
          team: ${{ inputs.team }}
          platforms: ${{ inputs.platforms }}

  deploy-prod:
    name: Deploy til prod
    needs: [ finn-commits, bygg-dev, deploy-dev, bygg-prod ]
    # Med prod-fra-standardbranch deployes dev-imaget, og bare når dev-deployen gikk bra.
    # Ellers er prod uavhengig av dev, og trenger bare bygget av releasen.
    if: >-
      !cancelled() && inputs.prod && needs.finn-commits.outputs.prod-sha != '' && (
        inputs.prod-fra-standardbranch && needs.deploy-dev.result == 'success' && needs.deploy-dev.outputs.deployet == 'true'
        || !inputs.prod-fra-standardbranch && needs.bygg-prod.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    outputs:
      deployet: ${{ steps.gjeldende.outputs.deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.finn-commits.outputs.prod-sha }}
          persist-credentials: false
      # En release kan ha blitt publisert og deployet mens vi bygget. Samme oppslag som i
      # finn-commits.
      - name: Er commiten fortsatt den siste?
        id: gjeldende
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.finn-commits.outputs.prod-sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          UTEN_PRERELEASE: ${{ inputs.uten-prerelease }}
          FRA_STANDARDBRANCH: ${{ inputs.prod-fra-standardbranch }}
        run: |
          if [[ "$FRA_STANDARDBRANCH" == 'true' ]]; then
            tag=$DEFAULT_BRANCH
          else
            utvalg='select(.draft | not)'
            [[ "$UTEN_PRERELEASE" == 'true' ]] && utvalg+=' | select(.prerelease | not)'
            tag=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq "[.[] | $utvalg] | max_by(.published_at) | .tag_name // \"\"")
          fi
          naa=$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)
          if [[ "$naa" == "$SHA" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Siste for prod er $tag ($naa), ikke $SHA; hopper over prod-deploy" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Deploy ${{ !inputs.uten-vars && inputs.prod-vars || inputs.prod-cluster }}
        if: steps.gjeldende.outputs.deploy == 'true'
        uses: nais/deploy/actions/deploy@427e29c94d911626a023a76f402f6dcae1f840b7 # v3
        env:
          CLUSTER: ${{ inputs.prod-cluster }}
          RESOURCE: ${{ inputs.prod-resource || inputs.nais-resource }}
          VARS: ${{ !inputs.uten-vars && inputs.prod-vars || '' }}
          VAR: ${{ inputs.prod-var }}
          IMAGE: ${{ inputs.prod-fra-standardbranch && needs.bygg-dev.outputs.image || needs.bygg-prod.outputs.image }}
          TIMEOUT: 20m

  # Egen jobb, så feil i alle de andre jobbene også varsles.
  varsle:
    name: Slack-varsel
    needs: [ finn-commits, bygg-dev, deploy-dev, bygg-prod, deploy-prod ]
    if: always() && needs.finn-commits.result != 'skipped'
    runs-on: ubuntu-latest
    permissions: {}
    env:
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
    steps:
      - name: Slack-varsel
        if: env.SLACK_WEBHOOK != ''
        uses: rtCamp/action-slack-notify@06cc13f74fa8d4d2296c09455d91e9453e4025f4 # v2.4.1
        env:
          SLACK_COLOR: ${{ contains(needs.*.result, 'failure') && 'danger' || 'good' }}
          SLACK_USERNAME: Github Actions
          SLACK_ICON: https://github.com/github.png?size=48
          SLACK_TITLE: Rebygg av ${{ github.event.repository.name }} ${{ contains(needs.*.result, 'failure') && 'feilet' || 'er ferdig' }}
          SLACK_MESSAGE: >-
            dev: ${{ needs.deploy-dev.outputs.deployet == 'false' && 'hoppet over (nyere deploy)' || needs.deploy-dev.result }}
            · prod (${{ needs.finn-commits.outputs.prod-tag || inputs.prod-fra-standardbranch && github.event.repository.default_branch || 'ingen release' }}):
            ${{ needs.deploy-prod.outputs.deployet == 'false' && 'hoppet over (nyere deploy)' || needs.deploy-prod.result }}
            · ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
