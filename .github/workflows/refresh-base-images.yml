name: Rebygg apper med nytt baseimage

# Starter rebygg-og-deploy.yml i hver app i baseimage/apps.json. Selve bygget og deployen
# kjører i appens eget repo, så resultatet vises der.
on:
  schedule:
    # Mandag morgen, så teamet er på jobb hvis noe feiler.
    - cron: '0 7 * * 1'
      timezone: Europe/Oslo
  workflow_dispatch:
    inputs:
      repository:
        description: Navn på ett repo, eller tomt for alle i baseimage/apps.json
        required: false
        type: string
      prod:
        description: Deploy også til prod
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  start:
    name: Start rebygg
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Velg repoer
        id: repoer
        env:
          VALGT: ${{ inputs.repository }}
        run: |
          if [[ -n "$VALGT" ]]; then
            repoer=$(jq -cn --arg r "$VALGT" '[$r]')
          else
            repoer=$(jq -c '.apps' baseimage/apps.json)
          fi
          if ! jq -e 'length > 0' <<< "$repoer" > /dev/null; then
            echo "::error::Ingen repoer valgt"
            exit 1
          fi
          echo "repoer=$repoer" >> "$GITHUB_OUTPUT"
          echo "kommaliste=$(jq -r 'join(",")' <<< "$repoer")" >> "$GITHUB_OUTPUT"

      - name: Lag token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.MELOSYS_CI_CLIENT_ID }}
          private-key: ${{ secrets.MELOSYS_CI_PRIVATE_KEY }}
          owner: navikt
          repositories: ${{ steps.repoer.outputs.kommaliste }}
          permission-actions: write
          permission-metadata: read

      - name: Start rebygg-og-deploy.yml i hver app
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPOER: ${{ steps.repoer.outputs.repoer }}
          # Planlagt kjøring har ingen inputs, og skal deploye til prod.
          PROD: ${{ github.event_name == 'schedule' || inputs.prod }}
        run: |
          printf '## Startede rebygg\n\nResultatet vises i hvert repo.\n\n| Repo | Kjøring |\n| --- | --- |\n' >> "$GITHUB_STEP_SUMMARY"
          feilet=0
          while IFS= read -r navn; do
            repo="navikt/$navn"
            if branch=$(gh api "repos/$repo" --jq .default_branch) &&
              url=$(gh api --method POST "repos/$repo/actions/workflows/rebygg-og-deploy.yml/dispatches" \
                -H "X-GitHub-Api-Version: 2026-03-10" \
                -f "ref=$branch" -f "inputs[prod]=$PROD" --jq .html_url); then
              printf '| %s | [Åpne](%s) |\n' "$repo" "$url" >> "$GITHUB_STEP_SUMMARY"
            else
              printf '| %s | Kunne ikke startes |\n' "$repo" >> "$GITHUB_STEP_SUMMARY"
              echo "::error::Kunne ikke starte rebygg i $repo"
              feilet=1
            fi
          done < <(jq -r '.[]' <<< "$REPOER")
          exit "$feilet"

      - name: Slack-varsel ved feil
        if: failure()
        uses: rtCamp/action-slack-notify@06cc13f74fa8d4d2296c09455d91e9453e4025f4 # v2.4.1
        env:
          SLACK_COLOR: danger
          SLACK_USERNAME: Github Actions
          SLACK_ICON: https://github.com/github.png?size=48
          SLACK_TITLE: Kunne ikke starte ukentlig rebygg av melosys-apper
          SLACK_MESSAGE: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
